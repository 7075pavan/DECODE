<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior:none;background-color:#0B0F1A;color:#dfe2f2;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary": "#472a00", "primary-container": "#22d3ee", "on-primary-container": "#005763", "surface-variant": "#313441", "surface-container": "#121826", "on-background": "#dfe2f2", "on-error-container": "#ffdad6", "tertiary-fixed-dim": "#45dfa4", "outline-variant": "#263047", "on-tertiary-fixed-variant": "#005137", "error": "#ffb4ab", "surface-container-high": "#1b2336", "on-tertiary-fixed": "#002114", "surface-dim": "#0B0F1A", "primary-fixed": "#a2eeff", "surface-tint": "#22d3ee", "error-container": "#93000a", "surface-container-lowest": "#070a12", "on-secondary-container": "#5b3800", "background": "#0B0F1A", "surface-bright": "#353945", "outline": "#859397", "inverse-primary": "#006877", "secondary": "#ffb95f", "tertiary": "#61f6b9", "on-surface": "#dfe2f2", "on-secondary-fixed": "#2a1700", "on-secondary-fixed-variant": "#653e00", "secondary-fixed": "#ffddb8", "secondary-container": "#ee9800", "on-primary-fixed": "#001f25", "surface": "#0B0F1A", "on-tertiary": "#003825", "surface-container-low": "#0f1422", "on-primary": "#00363e", "tertiary-container": "#3dd99e", "secondary-fixed-dim": "#ffb95f", "primary": "#22d3ee", "on-tertiary-container": "#005a3e", "inverse-surface": "#dfe2f2", "on-surface-variant": "#9ba6b8", "on-error": "#690005", "tertiary-fixed": "#68fcbf", "on-primary-fixed-variant": "#004e5a", "inverse-on-surface": "#2c303c", "primary-fixed-dim": "#22d3ee", "surface-container-highest": "#263047" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "gutter": "1rem", "margin": "1rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "space-xl": "2rem", "space-md": "1rem", "gutter-desktop": "1.5rem", "margin-desktop": "2.5rem" }, fontFamily: { "label-md": ["JetBrains Mono"], "headline-md": ["Sora"], "headline-xl-mobile": ["Sora"], "headline-lg-mobile": ["Sora"], "headline-lg": ["Sora"], "headline-xl": ["Sora"], "label-lg": ["JetBrains Mono"], "body-lg": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"] } } } };</script></head><body class="bg-[#0B0F1A] text-on-surface min-h-screen flex flex-col justify-center items-center"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-[#0B0F1A]"><div class="w-full max-w-[460px] mx-auto px-5 py-6 flex-1 flex flex-col justify-between"><div class="flex flex-col w-full relative my-auto">

<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-72 h-72 bg-[#22D3EE]/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Top Tag / Pill Indicator -->

<!-- Centered Circular Aperture / Fingerprint Logo Graphic -->
<div class="flex flex-col items-center text-center">
<div class="relative flex items-center justify-center mb-4">
<div class="absolute inset-0 rounded-full bg-[#22D3EE]/25 blur-lg scale-110"></div>
<div class="relative w-24 h-24 rounded-full bg-[#070a12] p-1 flex items-center justify-center border border-[#263047] shadow-xl shadow-[#22D3EE]/10">
<!-- SVG Precision Aperture / Dial Rings -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
<circle class="text-[#263047]" cx="50" cy="50" fill="none" opacity="0.6" r="45" stroke="currentColor" stroke-dasharray="3 4" stroke-width="1.5"></circle>
<circle class="text-[#22D3EE]" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="140 180" stroke-linecap="round" stroke-width="2.5"></circle>
</svg>
<!-- Stylized Aperture / Fingerprint Symbol -->
<div class="w-16 h-16 rounded-full bg-[#121826] flex items-center justify-center border border-[#22D3EE]/30 relative z-10">
<span class="material-symbols-outlined text-[#22D3EE] text-3xl select-none">fingerprint</span>
</div>
</div>
</div>
<!-- Screen Heading / Brand (32px Bold) -->
<h1 class="font-headline-xl text-[32px] font-bold text-on-surface tracking-wider uppercase">
    DECODE
  </h1>
<!-- Tagline (18px-20px readable font) -->
<p class="font-body-lg text-[18px] leading-[26px] text-on-surface-variant mt-2 max-w-xs font-medium">
    Read people. Think clearly. Build wealth.
  </p>
</div>
<!-- Telemetry Dossier Preview Card (#121826 surface, 20px padding) -->

<!-- Terms Disclaimer Footer (13px-14px readable secondary text, minimum >= 12px) -->
<div class="mt-5 text-center px-4"><p class="text-[13px] leading-5 text-on-surface-variant font-body-sm text-center">Your progress syncs across your phone and laptop.</p></div>
</div>
</div>
<script>
  (function() {
    const googleBtn = document.getElementById('btn-google-auth');
    const guestBtn = document.getElementById('btn-guest-auth');

    if (googleBtn) {
      googleBtn.addEventListener('click', function() {
        this.classList.add('opacity-80', 'scale-[0.99]');
        setTimeout(() => {
          this.classList.remove('opacity-80', 'scale-[0.99]');
        }, 180);
      });
    }

    if (guestBtn) {
      guestBtn.addEventListener('click', function() {
        this.classList.add('opacity-80', 'scale-[0.99]');
        setTimeout(() => {
          this.classList.remove('opacity-80', 'scale-[0.99]');
        }, 180);
      });
    }
  })();
</script></main>

</body></html>
